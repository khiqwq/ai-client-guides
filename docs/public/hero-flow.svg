<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" role="img" aria-labelledby="title desc">
<title id="title">CodeFlow API 接入终端</title><desc id="desc">在终端中完成 CodeFlow API 配置并连接多个 AI 编程工具</desc>
<defs>
  <linearGradient id="panel" x1="90" y1="58" x2="508" y2="370" gradientUnits="userSpaceOnUse"><stop stop-color="#171717"/><stop offset="1" stop-color="#101010"/></linearGradient>
  <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(300 218) rotate(90) scale(190 235)" gradientUnits="userSpaceOnUse"><stop stop-color="#37be95" stop-opacity=".16"/><stop offset="1" stop-color="#37be95" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000" flood-opacity=".42"/></filter>
</defs>
<ellipse cx="300" cy="224" rx="250" ry="194" fill="url(#glow)"/>
<g filter="url(#shadow)">
  <rect x="70" y="50" width="460" height="330" rx="18" fill="url(#panel)" stroke="#2b2b2b"/>
  <path d="M70 96h460" stroke="#292929"/>
  <circle cx="98" cy="73" r="5" fill="#363636"/><circle cx="118" cy="73" r="5" fill="#363636"/><circle cx="138" cy="73" r="5" fill="#363636"/>
  <text x="300" y="78" fill="#777" font-size="12" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">codeflow — setup</text>
</g>
<g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">
  <text x="100" y="132" fill="#777">$</text><text x="120" y="132" fill="#e8e8e8">connect --provider codeflow</text>
  <text x="100" y="169" fill="#37be95">●</text><text x="120" y="169" fill="#a3a3a3">Base URL</text><text x="232" y="169" fill="#f3f3f3">https://codeflow.asia</text>
  <text x="100" y="200" fill="#37be95">●</text><text x="120" y="200" fill="#a3a3a3">API token</text><text x="232" y="200" fill="#f3f3f3">sk-••••••••••••</text>
  <text x="100" y="231" fill="#37be95">●</text><text x="120" y="231" fill="#a3a3a3">Protocol</text><text x="232" y="231" fill="#f3f3f3">Anthropic / OpenAI</text>
  <rect x="98" y="257" width="404" height="1" fill="#272727"/>
  <text x="100" y="288" fill="#37be95">✓</text><text x="122" y="288" fill="#e8e8e8">Configuration verified</text>
  <text x="100" y="318" fill="#737373">Ready for Claude Code, Codex, Cursor and more.</text>
</g>
<g font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600">
  <g><rect x="38" y="136" width="86" height="30" rx="9" fill="#191919" stroke="#2b2b2b"/><circle cx="53" cy="151" r="3" fill="#37be95"/><text x="63" y="155" fill="#b8b8b8">Claude</text></g>
  <g><rect x="476" y="116" width="86" height="30" rx="9" fill="#191919" stroke="#2b2b2b"/><circle cx="491" cy="131" r="3" fill="#37be95"/><text x="501" y="135" fill="#b8b8b8">Codex</text></g>
  <g><rect x="30" y="294" width="86" height="30" rx="9" fill="#191919" stroke="#2b2b2b"/><circle cx="45" cy="309" r="3" fill="#37be95"/><text x="55" y="313" fill="#b8b8b8">Cursor</text></g>
  <g><rect x="486" y="300" width="88" height="30" rx="9" fill="#191919" stroke="#2b2b2b"/><circle cx="501" cy="315" r="3" fill="#37be95"/><text x="511" y="319" fill="#b8b8b8">OpenCode</text></g>
</g>
</svg>
